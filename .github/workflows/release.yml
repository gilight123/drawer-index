name: Release

# Builds the portable Windows .exe and attaches it to a GitHub Release
# whenever you push a tag like v1.0.0 (or run it manually).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Windows .exe
        run: npx @yao-pkg/pkg . --targets node22-win-x64 --output dist/DrawerIndex.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrawerIndex-windows
          path: dist/DrawerIndex.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DrawerIndex.exe
