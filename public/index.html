<!doctype html>
<!--
  Drawer Index — single-file front end (no framework, no build step).
  Structure of this file:
    <head>   : metadata, the whole stylesheet (CSS custom properties / theme
               tokens drive light & dark mode), and the two vendored libraries.
    <header> : top bar (brand, Drawers/Labels nav, theme toggle).
    <main>   : an empty <div id="app"> the script renders into.
    <script> : the entire app. Key pieces, in order:
               - h()            tiny DOM builder used everywhere
               - S              in-memory state; data layer talks to the REST API
               - render()       hash-router: #  / #print / #backups / #s:<id> / #<drawer>
               - renderBrowse / renderDrawer / renderSensor / renderPrint /
                 renderBackups / openPartEditor / openDrawerEditor / bulk dialogs
               - the A4 label engine (cellRect / cellSequence / drawPreview / makePDF)
               - theme + auth helpers near the bottom
  Data is fetched from and saved to the Node server (see server.js) over /api/*.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d7490">
<title>Drawer Index</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<!-- apply the saved theme before first paint so there's no light/dark flash -->
<script>try{var _t=localStorage.getItem('drawer-theme');if(_t==='dark'||_t==='light')document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<style>
  /* reset */
  *{box-sizing:border-box}
  html,body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}

  /* Layout: sticky utility bar over a search box + card grid; a transient
     editor sheet slides up for add/edit. Mono for drawer codes & part IDs,
     cyan accent for actions, white "paper" surfaces for QR labels. */
  :root{
    color-scheme:light;
    --bg:#f4f6f7; --surface:#ffffff; --surface-2:#e9edef;
    --fg:#18211f; --muted:#5a666c; --line:#d8dde0; --line-2:#c6ccd0;
    --accent:#0d7490; --accent-fg:#ffffff; --accent-weak:#e0f0f4;
    --good:#1a7f54; --warn:#9a5b00; --danger:#c23b2c; --danger-weak:#f7e4e1;
    --chip:#eef1f2; --shadow:0 1px 2px rgba(20,30,35,.06),0 6px 18px rgba(20,30,35,.07);
    --paper:#ffffff; --ink:#111111;
    --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --r:12px; --r-sm:8px;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#10161a; --surface:#19222a; --surface-2:#212c35;
    --fg:#e7edf0; --muted:#95a3ad; --line:#2d3a44; --line-2:#3a4a55;
    --accent:#35c2e8; --accent-fg:#06222b; --accent-weak:#0f2f3a;
    --good:#45d79a; --warn:#e3a94a; --danger:#f0776a; --danger-weak:#3a1f1c;
    --chip:#23303a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#10161a; --surface:#19222a; --surface-2:#212c35;
    --fg:#e7edf0; --muted:#95a3ad; --line:#2d3a44; --line-2:#3a4a55;
    --accent:#35c2e8; --accent-fg:#06222b; --accent-weak:#0f2f3a;
    --good:#45d79a; --warn:#e3a94a; --danger:#f0776a; --danger-weak:#3a1f1c;
    --chip:#23303a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
    color-scheme:dark;
  }
  body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);line-height:1.45;-webkit-text-size-adjust:100%}
  h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:16px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}

  .bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
    border-bottom:1px solid var(--line);padding-block:10px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.02em;font-size:16px}
  .brand .dot{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);flex:none}
  .brand .dot svg{width:14px;height:14px}
  .bar .sp{flex:1}
  .navbtn{border:1px solid transparent;background:none;color:var(--muted);padding:7px 11px;border-radius:999px;font-weight:500}
  .navbtn.on{color:var(--fg);background:var(--chip)}
  .navbtn:hover{color:var(--fg)}

  .wrap{max-width:860px;margin:0 auto;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:16px 48px}

  .tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px}
  .search svg{width:17px;height:17px;color:var(--muted);flex:none}
  .search input{border:0;outline:0;background:none;color:var(--fg);padding:11px 0;width:100%}
  .search input::placeholder{color:var(--muted)}
  .btn{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:10px 15px;font-weight:600;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);white-space:nowrap}
  .btn:hover{border-color:var(--muted)}
  .btn svg{width:16px;height:16px}
  .btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.ghost{background:none;border-color:var(--line)}
  .btn.danger{color:var(--danger);border-color:transparent;background:var(--danger-weak)}
  .btn.sm{padding:7px 11px;font-size:13px}
  .btn[disabled]{opacity:.5;pointer-events:none}

  .eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:4px 2px 10px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow);min-width:0}
  .card:hover{border-color:var(--line-2)}
  .code{font-family:var(--f-mono);font-weight:600;font-size:13px;letter-spacing:.02em;background:var(--accent-weak);color:var(--accent);padding:2px 8px;border-radius:6px;align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card h3{font-size:15px;font-weight:600;min-width:0;overflow-wrap:anywhere}
  .card .meta{font-size:12.5px;color:var(--muted);margin-top:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .thumbs{display:flex}
  .thumbs img{width:26px;height:26px;border-radius:5px;object-fit:cover;border:1.5px solid var(--surface);margin-left:-6px;background:var(--surface-2)}
  .thumbs img:first-child{margin-left:0}

  .list{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;text-align:left;min-width:0}
  .row:hover{border-color:var(--line-2)}
  .row .pic{width:46px;height:46px;border-radius:8px;flex:none;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
  .row .pic img{width:100%;height:100%;object-fit:cover}
  .row .pic svg{width:20px;height:20px;color:var(--muted)}
  .row .body{flex:1;min-width:0}
  .row .nm{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
  .row .sub{font-size:12.5px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:2px}
  .row .sub .code{font-size:11.5px;padding:1px 6px}
  .qty{display:flex;align-items:center;gap:0;flex:none;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
  .qty button{width:30px;height:30px;border:0;background:none;color:var(--fg);font-size:17px;line-height:1;display:grid;place-items:center}
  .qty button:hover{background:var(--chip)}
  .qty .n{min-width:30px;text-align:center;font-family:var(--f-mono);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
  .tag{font-size:11px;background:var(--chip);color:var(--muted);padding:1px 7px;border-radius:999px;font-weight:600;letter-spacing:.02em}
  .tag.ex{background:var(--warn);color:#fff}
  .tag.low{background:var(--warn);color:#fff}
  .tag.out{background:var(--danger);color:#fff}
  .tag.cat{background:var(--chip);color:var(--muted);font-weight:600}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.ex,:root:not([data-theme="light"]) .tag.low,:root:not([data-theme="light"]) .tag.out{color:#241a08}}
  :root[data-theme="dark"] .tag.ex,:root[data-theme="dark"] .tag.low,:root[data-theme="dark"] .tag.out{color:#241a08}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:-2px 0 14px}
  .chipbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .chipbtn.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}
  .chipbtn:hover{border-color:var(--line-2)}
  .chipbtn .d{width:7px;height:7px;border-radius:50%;background:var(--warn)}
  .chipbtn.on .d{background:var(--accent-fg)}
  .foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
  .steps{display:flex;flex-direction:column;gap:11px;margin:4px 0}
  .step{display:flex;gap:11px;align-items:flex-start;font-size:13.5px;color:var(--fg);line-height:1.4}
  .step b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
  .step .ic{width:24px;height:24px;border-radius:7px;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center;flex:none;font-weight:700}

  .empty{text-align:center;color:var(--muted);padding:46px 16px;border:1px dashed var(--line-2);border-radius:var(--r);background:var(--surface)}
  .empty h3{font-size:16px;color:var(--fg);margin-bottom:6px}
  .empty p{margin:0 auto 16px;max-width:36ch;font-size:14px}
  .banner{background:var(--accent-weak);color:var(--fg);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;font-size:13.5px;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start}
  .banner svg{width:17px;height:17px;flex:none;margin-top:1px;color:var(--accent)}

  .back{display:inline-flex;align-items:center;gap:5px;color:var(--muted);background:none;border:0;padding:4px 0;font-weight:500;margin-bottom:6px}
  .back:hover{color:var(--fg)}
  .dhead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .dhead .qrtile{width:104px;height:104px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:7px;flex:none}
  .dhead .qrtile svg{width:100%;height:100%;display:block}
  .dhead .dmeta{flex:1;min-width:180px}
  .dhead h2{font-size:21px;margin:2px 0 6px}
  .dhead .note{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
  .linkline{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .linkline code{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);background:var(--chip);padding:4px 8px;border-radius:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .scrim{position:fixed;inset:0;background:rgba(8,14,18,.46);z-index:40;display:flex;align-items:flex-end;justify-content:center}
  @media (min-width:640px){.scrim{align-items:center;padding:20px}}
  .sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;
    padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    box-shadow:0 -8px 40px rgba(0,0,0,.3)}
  @media (min-width:640px){.sheet{border-radius:16px}}
  .sheet h2{font-size:18px;margin-bottom:14px}
  .fld{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
  .fld label{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
  .ctl{background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:11px 12px;color:var(--fg);width:100%;outline:none}
  .ctl:focus{border-color:var(--accent)}
  textarea.ctl{resize:vertical;min-height:58px;line-height:1.4}
  .two{display:flex;gap:10px}
  .two>.fld{flex:1}
  .photo{display:flex;gap:12px;align-items:center}
  .photo .pv{width:72px;height:72px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;flex:none}
  .photo .pv img{width:100%;height:100%;object-fit:cover}
  .photo .pv svg{width:24px;height:24px;color:var(--muted)}
  .sheet .actions{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
  .sheet .actions .sp{flex:1}
  .hint{font-size:12px;color:var(--muted);margin-top:-6px;margin-bottom:12px}
  .confirm{font-size:13px;color:var(--danger);display:flex;align-items:center;gap:8px}

  .sheetpaper{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);position:relative;width:100%;aspect-ratio:210/297;margin-top:4px;overflow:hidden}
  .cell{position:absolute;display:flex;align-items:center;gap:3%;overflow:hidden;box-sizing:border-box;padding:3px;container-type:size}
  .cell .q{height:90%;aspect-ratio:1/1;flex:none}
  .cell .q svg{width:100%;height:100%;display:block}
  .cell .lbl{font-family:var(--f-mono);font-weight:700;color:#111;min-width:0;flex:1;line-height:1}
  .cell .lbl .cid{font-size:52cqh;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cell .lbl .cnm{font-family:var(--f-ui);font-weight:500;color:#444;font-size:22cqh;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cellborder{outline:1px dashed var(--line-2);outline-offset:-1px}
  .sheetpaper .cell{cursor:pointer}
  .cell.skipcell{background:repeating-linear-gradient(45deg,var(--line-2) 0 2.5px,transparent 2.5px 6px);outline:1px solid var(--line-2)}
  .selgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0 4px}
  .chk{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;font-size:13.5px}
  .chk input{width:17px;height:17px;accent-color:var(--accent);flex:none}
  .chk .code{font-size:11px}
  .adj{display:flex;gap:10px;flex-wrap:wrap}
  .adj .fld{flex:1;min-width:88px}
  .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:500;z-index:60;box-shadow:var(--shadow);max-width:90vw;text-align:center}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  .spin{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .6s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
<script src="/vendor/qrcode.min.js"></script>
<script src="/vendor/jspdf.umd.min.js"></script>
</head>
<body>
<header class="bar">
  <div class="brand"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><line x1="9" y1="7.5" x2="15" y2="7.5"/><line x1="9" y1="16.5" x2="15" y2="16.5"/></svg></span>Drawer Index</div>
  <div class="sp"></div>
  <button class="navbtn" data-nav="">Drawers</button>
  <button class="navbtn" data-nav="print">Labels</button>
  <button class="navbtn" id="theme-toggle" title="Light / dark" aria-label="Toggle light / dark theme" style="padding:7px 9px"></button>
</header>
<main id="app" class="wrap"></main>

<script>
(function(){
  "use strict";
  var qrcode = window.qrcode;
  var jsPDFns = window.jspdf;

  var S = {
    canWrite:true, ready:false, failed:false,
    drawers:new Map(), parts:new Map(),
    query:"", toastT:0, lowOnly:false, tag:"", lastJSON:""
  };
  var app = document.getElementById("app");
  var JH = {"Content-Type":"application/json"};

  function h(tag, attrs){
    var e=document.createElement(tag), i, k;
    if(attrs) for(k in attrs){
      var v=attrs[k];
      if(v==null||v===false) continue;
      if(k==="class") e.className=v;
      else if(k==="text") e.textContent=v;
      else if(k==="html") e.innerHTML=v;
      else if(k.slice(0,2)==="on") e.addEventListener(k.slice(2).toLowerCase(),v);
      else if(k==="dataset"){for(var d in v) e.dataset[d]=v[d];}
      else e.setAttribute(k,v);
    }
    for(i=2;i<arguments.length;i++){
      var c=arguments[i]; if(c==null) continue;
      if(Array.isArray(c)) c.forEach(function(x){if(x!=null)e.append(x.nodeType?x:document.createTextNode(x));});
      else e.append(c.nodeType?c:document.createTextNode(c));
    }
    return e;
  }
  var ICON={
    search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    chip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M4 9h3M4 12h3M4 15h3M17 9h3M17 12h3M17 15h3M9 4v3M12 4v3M15 4v3M9 17v3M12 17v3M15 17v3"/></svg>',
    back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
    cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L18 8h2a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.2"/></svg>',
    info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="8" r="1" fill="currentColor" stroke="none"/></svg>',
    dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><polyline points="7 11 12 16 17 11"/><path d="M4 20h16"/></svg>'
  };

  function toast(msg){
    var old=document.querySelector(".toast"); if(old) old.remove();
    var t=h("div",{class:"toast",text:msg}); document.body.append(t);
    var id=++S.toastT;
    setTimeout(function(){ if(id===S.toastT) t.remove(); },2600);
  }
  function linkBase(){
    var b=(location.origin+location.pathname).replace(/[#?].*$/,"");
    // strip any /d/<x> or /s/<x> deep-link path so the base is the app root
    b=b.replace(/\/(d|s)\/[^/]*\/?$/,"/");
    if(b.slice(-1)!=="/") b+="/";
    return b;
  }
  function drawerURL(id){ return linkBase()+"d/"+encodeURIComponent(id); }
  function sensorURL(id){ return linkBase()+"s/"+encodeURIComponent(id); }
  function qrSvg(text,opts){
    var q=qrcode(0,"L"); q.addData(text); q.make();
    return q.createSvgTag({cellSize:opts&&opts.cell||4,margin:0,scalable:true});
  }
  function partsOf(did){
    var a=[]; S.parts.forEach(function(p,id){ if(p.drawerId===did){a.push(Object.assign({_id:id},p));} });
    a.sort(function(x,y){return (x.name||"").localeCompare(y.name||"");});
    return a;
  }
  function stockState(p){
    var q=p.qty==null?1:p.qty;
    if(q<=0) return "out";
    if(p.min!=null && p.min!=="" && q<=p.min) return "low";
    return "ok";
  }
  function drawerList(){
    var a=[]; S.drawers.forEach(function(d,id){a.push(Object.assign({_id:id},d));});
    a.sort(function(x,y){ return (x.order||0)-(y.order||0) || x._id.localeCompare(y._id); });
    return a;
  }

  // ---- data layer: REST API on this server ----
  function sheetOpen(){ return !!document.querySelector(".scrim"); }
  function typing(){ return /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||""); }
  async function load(initial){
    try{
      var r=await fetch("/api/state",{cache:"no-store"});
      if(r.status===401){ S.ready=true; renderLogin(); return; }   // password required
      if(!r.ok) throw new Error("state");
      var j=await r.json();
      var js=JSON.stringify(j);
      S.ready=true; S.failed=false;
      if(!initial && js===S.lastJSON) return;   // nothing changed
      S.lastJSON=js;
      var dm=new Map(), pm=new Map();
      Object.keys(j.drawers||{}).forEach(function(k){dm.set(k,j.drawers[k]);});
      Object.keys(j.parts||{}).forEach(function(k){pm.set(k,j.parts[k]);});
      S.drawers=dm; S.parts=pm;
      if(initial || (!sheetOpen() && !typing())) render();
    }catch(e){
      S.ready=true;
      if(initial){ S.failed=true; renderOffline(); }
    }
  }
  async function apiPut(coll,id,data){ var r=await fetch("/api/"+coll+"/"+encodeURIComponent(id),{method:"PUT",headers:JH,body:JSON.stringify(data)}); if(!r.ok) throw new Error("save"); }
  async function apiPatch(coll,id,data){ var r=await fetch("/api/"+coll+"/"+encodeURIComponent(id),{method:"PATCH",headers:JH,body:JSON.stringify(data)}); if(!r.ok) throw new Error("patch"); }
  async function apiDel(coll,id){ var r=await fetch("/api/"+coll+"/"+encodeURIComponent(id),{method:"DELETE"}); if(!r.ok) throw new Error("del"); }
  async function uploadImage(file){
    var ext=((file.name&&file.name.split(".").pop())||"").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
    var r=await fetch("/api/upload?ext="+ext,{method:"POST",headers:{"Content-Type":file.type||"application/octet-stream"},body:file});
    if(!r.ok) throw new Error("upload"); return (await r.json()).url;
  }
  async function saveDrawer(id,data){ await apiPut("drawers",id,data); S.drawers.set(id,data); S.lastJSON=""; }
  async function savePart(id,data){ await apiPut("parts",id,data); S.parts.set(id,data); S.lastJSON=""; }
  async function delPart(id){ await apiDel("parts",id); S.parts.delete(id); S.lastJSON=""; }
  async function delDrawer(id){
    await apiDel("drawers",id); S.drawers.delete(id);
    var ids=[]; S.parts.forEach(function(p,pid){ if(p.drawerId===id) ids.push(pid); });
    ids.forEach(function(pid){ S.parts.delete(pid); });
    S.lastJSON="";
  }

  function saveBlob(filename, blob){
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1200);
  }

  function newId(pre){ return pre+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

  // =========================================================
  //  RENDER
  // =========================================================
  function render(){
    var hash=decodeURIComponent(location.hash.replace(/^#/,""));
    document.querySelectorAll(".navbtn").forEach(function(b){ b.classList.toggle("on", b.dataset.nav===(hash==="print"?"print":"")); });
    if(!S.ready){ app.replaceChildren(h("div",{class:"empty"},h("span",{class:"spin"})," Loading…")); return; }
    if(S.failed){ return renderOffline(); }
    if(hash==="print"){ return renderPrint(); }
    if(hash==="backups"){ return renderBackups(); }
    if(hash.indexOf("s:")===0){ return renderSensor(hash.slice(2)); }
    if(hash && S.drawers.has(hash)){ return renderDrawer(hash); }
    if(hash && hash!=="" && !S.drawers.has(hash)){ return renderMissing(hash); }
    return renderBrowse();
  }

  function renderOffline(){
    app.replaceChildren(h("div",{class:"empty"},
      h("h3",{text:"Can’t reach the server"}),
      h("p",{text:"The page loaded but the inventory service didn’t answer. Check that the container is running (docker compose ps), then reload."}),
      h("button",{class:"btn primary",onclick:function(){location.reload();}},"Reload")
    ));
  }

      )

  function refreshBrowse(){ renderFilters(); updateResults(); }
  function renderFilters(){
    var box=document.getElementById("filters"); if(!box) return;
    var tags={}, lowCount=0;
    S.drawers.forEach(function(d){ (d.tags||[]).forEach(function(t){tags[t]=(tags[t]||0)+1;}); });
    S.parts.forEach(function(p){ (p.tags||[]).forEach(function(t){tags[t]=(tags[t]||0)+1;}); if(stockState(p)!=="ok") lowCount++; });
    var names=Object.keys(tags).sort(function(a,b){return a.toLowerCase().localeCompare(b.toLowerCase());});
    var chips=[];
    if(lowCount || S.lowOnly){
      chips.push(h("button",{class:"chipbtn"+(S.lowOnly?" on":""),onclick:function(){S.lowOnly=!S.lowOnly;refreshBrowse();}},
        h("span",{class:"d"}), "Low / out"+(lowCount?" ("+lowCount+")":"")));
    }
    names.forEach(function(t){
      chips.push(h("button",{class:"chipbtn"+(S.tag===t?" on":""),onclick:function(){S.tag=(S.tag===t?"":t);refreshBrowse();}}, "#"+t));
    });
    if(chips.length) box.replaceChildren(h("div",{class:"chips"},chips)); else box.replaceChildren();
  }

  function updateResults(){
    var box=document.getElementById("results"); if(!box) return;
    var q=S.query.trim().toLowerCase();
    var filtering = q || S.lowOnly || S.tag;
    if(filtering){
      var dhits=[];
      if(!S.lowOnly){
        drawerList().forEach(function(d){
          if(S.tag && (d.tags||[]).indexOf(S.tag)<0) return;
          if(q){
            var dhay=((d._id||"")+" "+(d.name||"")+" "+(d.note||"")+" "+((d.tags||[]).join(" "))).toLowerCase();
            if(dhay.indexOf(q)<0) return;
          }
          dhits.push(d);
        });
      }
      var hits=[];
      S.parts.forEach(function(p,id){
        if(S.lowOnly && stockState(p)==="ok") return;
        if(S.tag && (p.tags||[]).indexOf(S.tag)<0) return;
        if(q){
          var dn=(S.drawers.get(p.drawerId)||{}).name||"";
          var hay=((p.name||"")+" "+(p.note||"")+" "+(p.drawerId||"")+" "+dn+" "+((p.tags||[]).join(" "))).toLowerCase();
          if(hay.indexOf(q)<0) return;
        }
        hits.push(Object.assign({_id:id},p));
      });
      hits.sort(function(a,b){return (a.name||"").localeCompare(b.name||"");});
      var lab=[]; if(q)lab.push("“"+S.query.trim()+"”"); if(S.lowOnly)lab.push("low / out"); if(S.tag)lab.push("#"+S.tag);
      var labTxt=lab.length?" · "+lab.join(" · "):"";
      var nodes=[];
      if(dhits.length){
        nodes.push(h("div",{class:"eyebrow",text:dhits.length+" drawer"+(dhits.length===1?"":"s")+labTxt}));
        nodes.push(h("div",{class:"grid"}, dhits.map(drawerCard)));
      }
      nodes.push(h("div",{class:"eyebrow",style:dhits.length?"margin-top:18px":"",text:hits.length+" item"+(hits.length===1?"":"s")+(dhits.length?"":labTxt)}));
      if(hits.length) nodes.push(h("div",{class:"list"},hits.map(function(p){return sensorRow(p,true);})));
      else if(!dhits.length) nodes.push(h("div",{class:"empty"},h("p",{text:"Nothing matches these filters."})));
      else nodes.push(h("div",{class:"hint",style:"margin:2px"},"No items — only drawers match."));
      box.replaceChildren.apply(box,nodes);
      return;
    }
    var ds=drawerList();
    if(!ds.length){
      box.replaceChildren(h("div",{class:"empty"},
        h("h3",{text:"Nothing here yet"}),
        h("p",{text:"Make a drawer, box, or bin for each place you store things, then add the items inside it. Each drawer gets a QR label you can print."}),
        h("div",{style:"display:flex;gap:10px;justify-content:center;flex-wrap:wrap"},
          h("button",{class:"btn primary",onclick:function(){openPartEditor({isNew:true});}},h("span",{html:ICON.plus}),"Add first item"),
          h("button",{class:"btn ghost",onclick:function(){openDrawerEditor({isNew:true});}},"New empty drawer")
        )
      ));
      return;
    }
    box.replaceChildren(
      h("div",{class:"eyebrow",text:ds.length+" drawer"+(ds.length===1?"":"s")}),
      h("div",{class:"grid"}, ds.map(drawerCard))
    );
  }

  var _busy={};
  async function bump(id,delta,node){
    if(_busy[id]) return; _busy[id]=true;
    var p=S.parts.get(id); if(!p){_busy[id]=false;return;}
    var nq=Math.max(0,(p.qty==null?1:p.qty)+delta);
    node.textContent=String(nq); p.qty=nq; S.lastJSON="";
    try{ await apiPatch("parts",id,{qty:nq}); }
    catch(e){ toast("Couldn’t update quantity"); }
    _busy[id]=false;
    // refresh low/out badges without disturbing anything open
    if(!sheetOpen() && !typing()) render();
  }

  function copy(text,btn){
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){toast("Copied");},function(){fallbackCopy(text);});
      } else fallbackCopy(text);
    }catch(e){ fallbackCopy(text); }
  }
  function fallbackCopy(text){
    var ta=h("textarea",{}); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.append(ta); ta.select();
    try{ document.execCommand("copy"); toast("Copied"); }catch(e){ toast("Select and copy"); }
    ta.remove();
  }

  // every tag used anywhere, for tap-to-reuse suggestions
  function allTags(){
    var set={};
    S.drawers.forEach(function(d){(d.tags||[]).forEach(function(t){set[t]=1;});});
    S.parts.forEach(function(p){(p.tags||[]).forEach(function(t){set[t]=1;});});
    return Object.keys(set).sort(function(a,b){return a.toLowerCase().localeCompare(b.toLowerCase());});
  }
  function tagSuggest(inputEl){
    var names=allTags(); if(!names.length) return null;
    function parse(){ return (inputEl.value||"").split(",").map(function(s){return s.trim();}).filter(Boolean); }
    var wrap=h("div",{class:"chips",style:"margin-top:2px"});
    function build(){
      var cur=parse().map(function(s){return s.toLowerCase();});
      wrap.replaceChildren.apply(wrap, names.map(function(t){
        var on=cur.indexOf(t.toLowerCase())>=0;
        return h("button",{type:"button",class:"chipbtn"+(on?" on":""),style:"padding:4px 10px;font-size:11.5px",onclick:function(){
          var list=parse();
          if(on) list=list.filter(function(s){return s.toLowerCase()!==t.toLowerCase();});
          else list.push(t);
          inputEl.value=list.join(", "); build();
        }},"#"+t);
      }));
    }
    build();
    inputEl.addEventListener("input",build);
    return h("div",{style:"margin:-6px 0 12px"}, h("div",{class:"hint",style:"margin:0 0 4px"},"Tap to add/remove a tag you’ve used before:"), wrap);
  }

  // bulk drawer generator — letters × numbers (A1…D6), plain numbers, or letters
  function genCodes(lf,lt,nf,nt,pad){
    var letters=[]; lf=(lf||"").trim().toUpperCase(); lt=(lt||"").trim().toUpperCase();
    if(lf){
      var a=lf.charCodeAt(0), b=(lt||lf).charCodeAt(0);
      if(a>=65&&a<=90&&b>=65&&b<=90){ if(b<a){var t=a;a=b;b=t;} for(var cc=a;cc<=b;cc++) letters.push(String.fromCharCode(cc)); }
      else return [];
    }
    if(!letters.length) letters=[""];
    var nums=[]; var f=parseInt(nf,10), t2=parseInt(nt,10);
    if(!isNaN(f)&&!isNaN(t2)){ if(t2<f){var x=f;f=t2;t2=x;} for(var n=f;n<=t2;n++) nums.push(pad?("00"+n).slice(-2):String(n)); }
    var out=[];
    letters.forEach(function(L){ if(nums.length){ nums.forEach(function(ns){ out.push(L+ns); }); } else if(L!=="") out.push(L); });
    return out.map(function(x){return x.replace(/[^A-Za-z0-9_~.\-]/g,"");}).filter(Boolean);
  }

  function backupRow(b){
    var auto=b.name.indexOf("prerestore")>=0;
    var confirmWrap=h("div",{style:"flex-basis:100%"});
    function ask(){ confirmWrap.replaceChildren(h("div",{class:"banner"},
      h("span",{class:"confirm"},"Restore everything to this point? Your current data is auto-backed-up first, so you can undo."),
      h("button",{class:"btn sm danger",onclick:doRestore},"Yes, restore"),
      h("button",{class:"btn sm ghost",onclick:function(){confirmWrap.replaceChildren();}},"Cancel"))); }
    async function doRestore(){
      try{ var r=await fetch("/api/restore",{method:"POST",headers:JH,body:JSON.stringify({name:b.name})}); if(!r.ok) throw 0;
        S.lastJSON=""; await load(true); toast("Restored from "+fmtDate(b.createdAt)); location.hash=""; }
      catch(e){ toast("Restore failed"); }
    }
    function delAsk(){ confirmWrap.replaceChildren(h("div",{class:"banner"},
      h("span",{class:"confirm"},"Delete this backup?"),
      h("button",{class:"btn sm danger",onclick:doDel},"Delete"),
      h("button",{class:"btn sm ghost",onclick:function(){confirmWrap.replaceChildren();}},"Keep"))); }
    async function doDel(){ try{ await fetch("/api/backups/"+encodeURIComponent(b.name),{method:"DELETE"}); toast("Backup deleted"); loadBackups(); }catch(e){ toast("Couldn’t delete"); } }
    async function dl(){ try{ var r=await fetch("/api/backups/"+encodeURIComponent(b.name)); var blob=await r.blob(); saveBlob(b.name, blob); }catch(e){ toast("Download failed"); } }
    return h("div",{class:"row",style:"flex-wrap:wrap"},
      h("div",{class:"body"},
        h("div",{class:"nm",text:fmtDate(b.createdAt)}),
        h("div",{class:"sub"}, h("span",{text:(Math.round(b.bytes/102.4)/10)+" KB"}), auto?h("span",{class:"tag",text:"auto · before a restore"}):null)),
      h("button",{class:"btn sm",onclick:ask},"Restore"),
      h("button",{class:"btn sm ghost",onclick:dl},"Download"),
      h("button",{class:"btn sm ghost",onclick:delAsk},"Delete"),
      confirmWrap
    );
  }
  async function doBackup(ev){
    var btn=ev&&ev.currentTarget, ot=""; if(btn){btn.disabled=true;ot=btn.innerHTML;btn.textContent="";btn.append(h("span",{class:"spin"})," Saving");}
    try{ var r=await fetch("/api/backup",{method:"POST",headers:JH,body:JSON.stringify({})}); if(!r.ok) throw 0; toast("Backup created"); loadBackups(); }
    catch(e){ toast("Backup failed"); }
    if(btn){btn.disabled=false;btn.innerHTML=ot;}
  }

  function saveSheet(){ try{ localStorage.setItem("drawer-sheet",JSON.stringify(PR.sheet)); }catch(e){} }
  function gridCols(){ var s=PR.sheet||SHEETDEF; if(s.cols>0) return s.cols; var p=s.w+s.gx; if(p<=0) return 1; return Math.max(1, Math.floor((SHEET.pw - s.ml + s.gx + 0.01)/p)); }
  function gridRows(){ var s=PR.sheet||SHEETDEF; if(s.rows>0) return s.rows; var p=s.h+s.gy; if(p<=0) return 1; return Math.max(1, Math.floor((SHEET.ph - s.mt + s.gy + 0.01)/p)); }
  function perPageCount(){ return gridCols()*gridRows(); }
  var PR={base:null,sel:null,selP:null,mode:"drawers",nx:0,ny:0,start:1,sheet:null,skip:{}};

  function renderPrint(){
    if(PR.base==null) PR.base=linkBase();
    if(PR.sheet==null) PR.sheet=loadSheet();
    var ds=drawerList();
    var ps=[]; S.parts.forEach(function(p,id){ps.push(Object.assign({_id:id},p));});
    ps.sort(function(a,b){return (a.drawerId||"").localeCompare(b.drawerId||"")||(a.name||"").localeCompare(b.name||"");});
    if(PR.sel==null){ PR.sel={}; ds.forEach(function(d){PR.sel[d._id]=true;}); }
    if(PR.selP==null){ PR.selP={}; ps.forEach(function(p){PR.selP[p._id]=true;}); }

    var sensors = PR.mode==="sensors";
    var items = sensors? ps : ds;
    var selMap = sensors? PR.selP : PR.sel;

    var back=h("button",{class:"back",onclick:function(){location.hash="";}},h("span",{html:ICON.back}),"Drawers");
    var modeRow=h("div",{style:"display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap"},
      h("button",{class:"chipbtn"+(!sensors?" on":""),onclick:function(){PR.mode="drawers";renderPrint();}},"Drawer labels ("+ds.length+")"),
      h("button",{class:"chipbtn"+(sensors?" on":""),onclick:function(){PR.mode="sensors";renderPrint();}},"Item labels ("+ps.length+")")
    );

    if(!items.length){
      app.replaceChildren(back,
        h("h2",{style:"font-size:20px;margin-bottom:10px",text:"Print QR labels"}), modeRow,
        h("div",{class:"empty"},
          h("h3",{text:sensors?"No items to label yet":"No drawers to label yet"}),
          h("p",{text:sensors?"Add some items first, then come back to print a QR for each one.":"Create a drawer first, then come back to print its QR label."})));
      return;
    }

    var selGrid=h("div",{class:"selgrid"}, items.map(function(it){
      var key=it._id;
      var cb=h("input",{type:"checkbox"}); cb.checked=!!selMap[key];
      cb.addEventListener("change",function(){selMap[key]=cb.checked;drawPreview();updateCount();});
      if(sensors){
        return h("label",{class:"chk"},cb,
          h("span",{style:"overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1",text:it.name||"Unnamed"}),
          h("span",{class:"code",style:"font-size:10px",text:it.drawerId||""}));
      }
      return h("label",{class:"chk"},cb,h("span",{class:"code",text:it._id}),
        h("span",{style:"overflow:hidden;text-overflow:ellipsis;white-space:nowrap",text:(it.name&&it.name!==it._id)?it.name:""}));
    }));

    var countEl=h("span",{});
    function updateCount(){ var n=items.filter(function(it){return selMap[it._id];}).length; countEl.textContent=n+" selected"; dlBtn.disabled=!n; }

    var baseInput=h("input",{class:"ctl",id:"p-base",value:PR.base,oninput:function(e){PR.base=e.target.value.replace(/[#?].*$/,"");drawPreview();}});
    var startInput=h("input",{class:"ctl",type:"number",min:"1",value:PR.start,oninput:function(e){PR.start=Math.max(1,Math.min(perPageCount(),parseInt(e.target.value,10)||1));drawPreview();}});
    var nxInput=h("input",{class:"ctl",type:"number",step:"0.5",value:PR.nx,oninput:function(e){PR.nx=parseFloat(e.target.value)||0;drawPreview();}});
    var nyInput=h("input",{class:"ctl",type:"number",step:"0.5",value:PR.ny,oninput:function(e){PR.ny=parseFloat(e.target.value)||0;drawPreview();}});

    var gridInfo=h("div",{class:"hint",style:"margin:-2px 0 8px;color:var(--accent);font-weight:600"});
    function updateGridInfo(){ gridInfo.textContent=gridCols()+" × "+gridRows()+" = "+perPageCount()+" labels per sheet"; try{startInput.max=perPageCount();}catch(e){} }
    function sheetField(lbl,key,step){
      return h("div",{class:"fld"},h("label",{text:lbl}),
        h("input",{class:"ctl",type:"number",min:"0",step:step||"0.5",value:PR.sheet[key],
          oninput:function(e){ var v=parseFloat(e.target.value); PR.sheet[key]=isNaN(v)?0:Math.max(0,v); saveSheet(); drawPreview(); updateGridInfo(); }}));
    }

    var paper=h("div",{class:"sheetpaper",id:"paper"});
    var dlBtn=h("button",{class:"btn primary",onclick:function(e){makePDF(e);}},h("span",{html:ICON.dl}),"Download PDF (A4)");

    app.replaceChildren(
      back,
      h("h2",{style:"font-size:20px;margin-bottom:10px",text:"Print QR labels"}),
      modeRow,
      h("p",{class:"hint",style:"margin-bottom:14px",text:sensors
        ? "One QR per item — scanning opens that item straight away."
        : "One QR per drawer — scanning opens that drawer."}),
      h("div",{class:"banner"},h("span",{html:ICON.info}),
        h("span",{},"Print the PDF at ",h("b",{},"Actual size / 100 %")," (not “Fit to page”), or the squares won’t line up. Print one test sheet on plain paper first, then nudge X/Y below if needed.")),
      h("div",{class:"eyebrow",text:sensors?"Which items":"Which drawers"}),
      h("div",{style:"display:flex;gap:10px;margin-bottom:6px"},
        h("button",{class:"btn sm ghost",onclick:function(){items.forEach(function(it){selMap[it._id]=true;});renderPrint();}},"All"),
        h("button",{class:"btn sm ghost",onclick:function(){items.forEach(function(it){selMap[it._id]=false;});renderPrint();}},"None"),
        countEl),
      selGrid,
      h("div",{class:"eyebrow",style:"margin-top:16px",text:"Link base (what the QR opens)"}),
      baseInput,
      h("div",{class:"hint",text:"Use the address your phones will reach — your server’s IP or hostname (e.g. http://192.168.1.50:8095). Change it here and re-download if a scan doesn’t open the app."}),
      h("div",{class:"eyebrow",style:"margin-top:16px",text:"Sticker sheet — measure yours (mm)"}),
      gridInfo,
      h("div",{class:"adj"}, sheetField("Sticker width","w"), sheetField("Sticker height","h")),
      h("div",{class:"adj"}, sheetField("Gap across","gx"), sheetField("Gap down","gy")),
      h("div",{class:"adj"}, sheetField("Left margin","ml"), sheetField("Top margin","mt")),
      h("div",{class:"adj"}, sheetField("Columns (0 = auto)","cols","1"), sheetField("Rows (0 = auto)","rows","1")),
      h("div",{class:"hint",text:"Measure one sticker and the gaps on your real sheet, type them here, and the preview must line up with your die-cut stickers. Saved for next time."}),
      h("div",{class:"eyebrow",style:"margin-top:12px",text:"Fine alignment (shift whole grid)"}),
      h("div",{class:"adj"},
        h("div",{class:"fld"},h("label",{text:"Start at label #"}),startInput),
        h("div",{class:"fld"},h("label",{text:"Nudge X (mm)"}),nxInput),
        h("div",{class:"fld"},h("label",{text:"Nudge Y (mm)"}),nyInput)),
      h("div",{class:"eyebrow",style:"margin-top:8px",text:"Preview (A4)"}),
      h("div",{class:"hint",style:"margin:-2px 0 6px"},"Tap any square to skip it (e.g. a sticker you already used) — labels flow into the free squares. Tap again to un-skip."),
      paper,
      h("div",{style:"display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"}, dlBtn,
        h("button",{class:"btn ghost",onclick:function(){PR.skip={};drawPreview();}},"Clear skipped"))
    );
    drawPreview(); updateCount(); updateGridInfo();
  }

  function labelItems(){
    var base=PR.base.replace(/[#?].*$/,""); if(base.slice(-1)!=="/") base+="/";
    if(PR.mode==="sensors"){
      var ps=[]; S.parts.forEach(function(p,id){ps.push(Object.assign({_id:id},p));});
      ps.sort(function(a,b){return (a.drawerId||"").localeCompare(b.drawerId||"")||(a.name||"").localeCompare(b.name||"");});
      var arr=[]; ps.forEach(function(p){ if(PR.selP[p._id]) arr.push({primary:p.name||"Unnamed", secondary:p.drawerId||"", url:base+"s/"+encodeURIComponent(p._id)}); });
      return arr;
    }
    return drawerList().filter(function(x){return PR.sel[x._id];}).map(function(x){
      return {primary:x._id, secondary:(x.name&&x.name!==x._id)?x.name:"", url:base+"d/"+encodeURIComponent(x._id)};
    });
  }
  function cellRect(i){
    var s=PR.sheet||(PR.sheet=loadSheet()), cols=gridCols();
    var col=i%cols, row=Math.floor(i/cols);
    return { x:s.ml+PR.nx+col*(s.w+s.gx), y:s.mt+PR.ny+row*(s.h+s.gy), w:s.w, h:s.h };
  }
  function place(el,r){
    el.style.left=(r.x/SHEET.pw*100)+"%"; el.style.top=(r.y/SHEET.ph*100)+"%";
    el.style.width=(r.w/SHEET.pw*100)+"%"; el.style.height=(r.h/SHEET.ph*100)+"%";
  }
  function cellSequence(count){
    var per=perPageCount(), seq=[], idx=Math.max(0,PR.start-1), guard=0, max=per*200+count+20;
    while(seq.length<count && guard++<max){
      var page=Math.floor(idx/per), onPage=idx%per;
      if(page>0 || !PR.skip[onPage]) seq.push(idx);
      idx++;
    }
    return seq;
  }
  function toggleSkip(i){ return function(){ if(PR.skip[i]) delete PR.skip[i]; else PR.skip[i]=1; drawPreview(); }; }
  function drawPreview(){
    var paper=document.getElementById("paper"); if(!paper) return;
    paper.replaceChildren();
    var items=labelItems(); var per=perPageCount();
    var seq=cellSequence(items.length);
    var cellItem={}; for(var k=0;k<seq.length;k++){ if(seq[k]<per) cellItem[seq[k]]=k; }
    for(var i=0;i<per;i++){
      var r=cellRect(i);
      if(cellItem[i]!==undefined){
        var it=items[cellItem[i]];
        var cell=h("div",{class:"cell",title:"Click to skip this spot",onclick:toggleSkip(i)}); place(cell,r);
        var q=h("div",{class:"q",html:qrSvg(it.url,{cell:3})});
        var lbl=h("div",{class:"lbl"}, h("div",{class:"cid",text:it.primary}), it.secondary?h("div",{class:"cnm",text:it.secondary}):null);
        cell.append(q,lbl); paper.append(cell);
      } else {
        var sk=!!PR.skip[i];
        var g=h("div",{class:"cell cellborder"+(sk?" skipcell":""),title:sk?"Skipped — click to use":"Click to skip (already used)",onclick:toggleSkip(i)});
        place(g,r); paper.append(g);
      }
    }
    if(!items.length) paper.append(h("div",{style:"position:absolute;inset:0;display:grid;place-items:center;color:#999;font-size:13px",text:"Select items to see labels"}));
  }

  function makePDF(ev){
    if(!jsPDFns){ toast("PDF engine still loading — try again"); return; }
    var items=labelItems();
    if(!items.length){ toast("Select at least one item"); return; }
    var btn=ev&&ev.currentTarget, ot=""; if(btn){btn.disabled=true;ot=btn.innerHTML;btn.textContent="";btn.append(h("span",{class:"spin"})," Building PDF");}
    try{
      var doc=new jsPDFns.jsPDF({unit:"mm",format:"a4"});
      var per=perPageCount();
      var seq=cellSequence(items.length), curPage=0;
      for(var k=0;k<items.length;k++){
        var gidx=seq[k], page=Math.floor(gidx/per), idxOnPage=gidx%per;
        while(curPage<page){ doc.addPage(); curPage++; }
        var r=cellRect(idxOnPage), it=items[k];
        var qrSize=r.h-2, textX=r.x+1+qrSize+2, tw=r.w-(qrSize+3.5);
        drawQR(doc, it.url, r);
        doc.setTextColor(17,17,17); doc.setFont("courier","bold");
        doc.setFontSize(fitFont(doc,it.primary,tw,14));
        doc.text(it.primary, textX, r.y+r.h/2+(it.secondary?-1.2:0), {baseline:"middle",maxWidth:tw});
        if(it.secondary){
          doc.setFont("helvetica","normal"); doc.setTextColor(70,70,70);
          doc.setFontSize(Math.min(6, fitFont(doc,it.secondary,tw,6)));
          doc.text(trimTo(doc,it.secondary,tw), textX, r.y+r.h/2+2.6, {baseline:"middle"});
        }
      }
      saveBlob((PR.mode==="sensors"?"sensor-labels.pdf":"drawer-labels.pdf"), doc.output("blob"));
      toast("Label sheet downloaded");
    }catch(e){ toast("Couldn’t build the PDF"); }
    if(btn){btn.disabled=false;btn.innerHTML=ot;}
  }
  function drawQR(doc,text,r){
    var q=qrcode(0,"L"); q.addData(text); q.make();
    var n=q.getModuleCount(), size=r.h-2, ms=size/n, ox=r.x+1, oy=r.y+(r.h-size)/2;
    doc.setFillColor(17,17,17);
    for(var row=0;row<n;row++) for(var col=0;col<n;col++){ if(q.isDark(row,col)) doc.rect(ox+col*ms, oy+row*ms, ms*1.02, ms*1.02, "F"); }
  }
  function fitFont(doc,txt,maxW,start){ doc.setFontSize(start); var w=doc.getTextWidth(txt); return w<=maxW?start:Math.max(5,start*maxW/w); }
  function trimTo(doc,txt,maxW){ if(doc.getTextWidth(txt)<=maxW) return txt; var t=txt; while(t.length>1 && doc.getTextWidth(t+"…")>maxW) t=t.slice(0,-1); return t+"…"; }

  // CSV
  function csvCell(v){ v=(v==null?"":String(v)); return /[",\n\r]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }
  function exportCSV(){
    var list=[]; S.parts.forEach(function(p,id){list.push(Object.assign({_id:id},p));});
    if(!list.length){ toast("Nothing to export yet"); return; }
    list.sort(function(a,b){return (a.drawerId||"").localeCompare(b.drawerId||"")||(a.name||"").localeCompare(b.name||"");});
    var rows=[["Drawer code","Drawer name","Item","Qty","Low-stock at","Tags","Note","Status","Example"]];
    list.forEach(function(p){
      var dn=(S.drawers.get(p.drawerId)||{}).name||"";
      rows.push([p.drawerId||"",dn,p.name||"",(p.qty==null?1:p.qty),(p.min==null?"":p.min),(p.tags||[]).join("; "),p.note||"",stockState(p),p.example?"yes":""]);
    });
    var csv="﻿"+rows.map(function(r){return r.map(csvCell).join(",");}).join("\r\n");
    saveBlob("drawer-inventory.csv", new Blob([csv],{type:"text/csv;charset=utf-8"}));
    toast("CSV exported ("+list.length+" items)");
  }

  function installSteps(){
    var items=[
      {t:"iPhone / iPad — Safari",b:"Tap the Share button, then “Add to Home Screen.”"},
      {t:"Android — Chrome",b:"Open the ⋮ menu, then “Add to Home screen” (or “Install app”)."},
      {t:"Windows / Mac — Chrome or Edge",b:"Open the ⋮ menu, choose “Cast, save, and share” → “Install page as app.”"}
    ];
    return h("div",{class:"steps"}, items.map(function(it){
      return h("div",{class:"step"},h("span",{class:"ic",text:"›"}),h("div",{},h("b",{text:it.t}),h("span",{text:it.b})));
    }));
  }
  function showInstall(){
    var url=linkBase();
    sheet("Use it as an app", [
      h("p",{class:"hint",style:"margin-bottom:14px",text:"This runs from your own server, so it works on any phone or PC on the same network. Add it to your home screen or desktop for a one-tap app icon."}),
      h("div",{class:"fld"},h("label",{text:"App address"}),
        h("div",{class:"linkline"},h("code",{text:url}),
          h("button",{class:"btn sm ghost",onclick:function(ev){copy(url,ev.currentTarget);}},"Copy"))),
      installSteps(),
      h("div",{class:"banner"},h("span",{html:ICON.info}),
        h("span",{},"The device needs to reach your server — same Wi-Fi/LAN, or over your VPN. No account or internet needed beyond that.")),
      h("div",{class:"actions"},h("button",{class:"btn primary",onclick:closeSheet},"Got it"))
    ]);
  }

  // ---- theme (light / dark) ----
  // The stylesheet defines both palettes via tokens; this just flips an explicit
  // data-theme on <html> and remembers the choice. No choice = follow the OS.
  var ICON_SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var ICON_MOON='<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  var themeBtn=document.getElementById("theme-toggle");
  function appliedTheme(){ var t=document.documentElement.getAttribute("data-theme"); if(t) return t; return (window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light"; }
  function setTheme(t){ if(t) document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme"); try{localStorage.setItem("drawer-theme",t||"");}catch(e){} paintThemeBtn(); }
  function paintThemeBtn(){ if(themeBtn) themeBtn.innerHTML = appliedTheme()==="dark"? ICON_SUN : ICON_MOON; }
  if(themeBtn){ themeBtn.addEventListener("click",function(){ setTheme(appliedTheme()==="dark"?"light":"dark"); }); paintThemeBtn(); }

  // ---- optional password login (active only when the server sets AUTH_PASSWORD) ----
  function renderLogin(){
    closeSheet();
    var pw=h("input",{class:"ctl",type:"password",placeholder:"Password",autofocus:true});
    var remember=h("input",{type:"checkbox"}); remember.checked=true;
    var err=h("div",{class:"hint",style:"color:var(--danger)",hidden:true});
    var btn=h("button",{class:"btn primary",style:"width:100%",onclick:submit},"Sign in");
    pw.addEventListener("keydown",function(e){ if(e.key==="Enter") submit(); });
    app.replaceChildren(h("div",{style:"max-width:340px;margin:12vh auto 0"},
      h("div",{class:"brand",style:"justify-content:center;margin-bottom:20px;font-size:20px"},
        h("span",{class:"dot"},h("span",{html:ICON.chip})), "Drawer Index"),
      h("div",{class:"fld"},h("label",{text:"Password"}),pw),
      h("label",{class:"chk",style:"margin:-2px 0 12px"},remember,h("span",{text:"Remember me on this device"})),
      err, h("div",{style:"margin-top:4px"},btn)));
    async function submit(){
      err.hidden=true; btn.disabled=true;
      try{
        var r=await fetch("/api/login",{method:"POST",headers:JH,body:JSON.stringify({password:pw.value,remember:remember.checked})});
        if(r.ok){ S.authRequired=true; S.lastJSON=""; await load(true); }
        else { err.textContent="Wrong password."; err.hidden=false; btn.disabled=false; pw.value=""; pw.focus(); }
      }catch(e){ err.textContent="Couldn’t sign in — is the server reachable?"; err.hidden=false; btn.disabled=false; }
    }
  }
  async function logout(){ try{ await fetch("/api/logout",{method:"POST"}); }catch(e){} renderLogin(); }

  // ---- events ----
  document.querySelectorAll(".navbtn[data-nav]").forEach(function(b){
    b.addEventListener("click",function(){ location.hash=b.dataset.nav; });
  });
  window.addEventListener("hashchange",render);

  // A scanned QR arrives as a real path (/d/<code> or /s/<id>); translate it
  // to the app's internal route so fragments can never be dropped in transit.
  (function initDeepLink(){
    try{
      var m=location.pathname.match(/^\/(d|s)\/(.+?)\/?$/);
      if(m){
        var frag = m[1]==="d" ? decodeURIComponent(m[2]) : "s:"+decodeURIComponent(m[2]);
        history.replaceState(null,"","/#"+frag);
      }
    }catch(e){}
  })();

  // boot: learn whether login is enabled (to show a Log out button), then load
  async function boot(){
    try{ var a=await fetch("/api/auth"); var j=await a.json(); S.authRequired=!!j.required; }catch(e){}
    load(true);
  }
  render();
  boot();
  setInterval(function(){ if(!sheetOpen() && !typing()) load(false); }, 5000);
})();
</script>

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
